name: iOS 16 IOMobileFramebuffer ABI evidence extraction

'on':
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release containing the genuine iOS 16.7.16 HFSX root parts
        default: 'ios-root-20H392-44905109656'
      expected_sha256:
        description: Expected SHA-256 of the reassembled HFSX image
        default: '5f2e2aa6a80aea489946287d8cc32ef0ff6a1905a0d2923e8d4324163bb699b5'
      ipsw_version:
        description: blacktop/ipsw release tag used for dyld shared cache analysis
        default: 'v3.1.751'

permissions:
  contents: read

concurrency:
  group: ios-abi-extract-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      TAG: ${{ inputs.release_tag }}
      EXPECT_SHA: ${{ inputs.expected_sha256 }}
      IPSW_VERSION: ${{ inputs.ipsw_version }}
      WORK: /home/runner/work/abi-extract
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check runner disk capacity
        run: |
          df -h /
          AVAIL=$(df -B1 / | awk 'NR==2 {print $4}')
          echo "avail_bytes=$AVAIL"
          test "$AVAIL" -gt 35000000000 || { echo "runner disk too small" >&2; exit 1; }

      - name: Install HFS validation and extraction tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq hfsprogs coreutils curl gzip python3
          mkdir -p "$WORK/bin"
          ASSET_VERSION="${IPSW_VERSION#v}"
          URL="https://github.com/blacktop/ipsw/releases/download/${IPSW_VERSION}/ipsw_${ASSET_VERSION}_linux_x86_64.tar.gz"
          echo "ipsw_url=$URL"
          curl -fL --retry 3 -o "$WORK/bin/ipsw.tar.gz" "$URL"
          tar -xzf "$WORK/bin/ipsw.tar.gz" -C "$WORK/bin" ipsw
          chmod +x "$WORK/bin/ipsw"
          "$WORK/bin/ipsw" version

      - name: Download, verify and reassemble the genuine HFSX root
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          mkdir -p "$WORK/parts" "$WORK/mnt"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'ios-root-20H392.img.gz.part-*' --dir "$WORK/parts"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'parts-sha256.txt' --dir "$WORK" --clobber
          (cd "$WORK/parts" && sha256sum -c "$WORK/parts-sha256.txt") |
            tee "$WORK/parts-sha256-check.txt"
          test "$(ls "$WORK/parts"/ios-root-20H392.img.gz.part-* | wc -l)" = "4"
          cat "$WORK/parts"/ios-root-20H392.img.gz.part-* | gunzip > "$WORK/ios-root.img"
          SIZE=$(stat -c %s "$WORK/ios-root.img")
          echo "image_size=$SIZE"
          test "$SIZE" = "21474836480" || { echo "image size mismatch" >&2; exit 1; }
          SHA=$(sha256sum "$WORK/ios-root.img" | cut -d' ' -f1)
          echo "root_sha256=$SHA"
          test "$SHA" = "$EXPECT_SHA" || { echo "root hash mismatch" >&2; exit 1; }
          rm -rf "$WORK/parts"
          SIG=$(sudo dd if="$WORK/ios-root.img" bs=1 skip=1024 count=2 2>/dev/null | od -An -tx1 | tr -d ' \n')
          echo "hfsx_signature=$SIG"
          test "$SIG" = "4858" || { echo "not HFSX" >&2; exit 1; }
          sudo mount -t hfsplus -o loop,force,ro "$WORK/ios-root.img" "$WORK/mnt"
          test -x "$WORK/mnt/sbin/launchd"
          test -d "$WORK/mnt/private/preboot/Cryptexes/OS"

      - name: Locate dyld shared caches and extract ABI evidence
        run: |
          set -o pipefail
          mkdir -p "$WORK/out/extracted"
          sudo find "$WORK/mnt" -type f \
            \( -name 'dyld_shared_cache_arm64*' -o -name '*.symbols' \) \
            -printf '%p %s bytes\n' | sort | tee "$WORK/out/cache-paths.txt"
          DSC=$(sudo find "$WORK/mnt/System/Library/Caches/com.apple.dyld" -maxdepth 1 \
            -type f -name 'dyld_shared_cache_arm64' | head -1)
          test -n "$DSC" || { echo "no main arm64 dyld shared cache found" >&2; exit 1; }
          printf 'DSC=%s\n' "$DSC" | tee "$WORK/out/dsc-path.txt"
          printf '%s\n' "ipsw_version=$IPSW_VERSION" "root_sha256=$EXPECT_SHA" > "$WORK/out/provenance.txt"
          "$WORK/bin/ipsw" dyld info "$DSC" --dylibs > "$WORK/out/dyld-dylibs.txt" 2>&1 || true
          "$WORK/bin/ipsw" dyld image "$DSC" > "$WORK/out/images.txt" 2>&1 || true

          for IMAGE in \
            '/System/Library/PrivateFrameworks/IOMobileFramebuffer.framework/IOMobileFramebuffer' \
            '/usr/libexec/backboardd' \
            '/System/Library/Frameworks/QuartzCore.framework/QuartzCore' \
            '/System/Library/PrivateFrameworks/CoreBrightness.framework/CoreBrightness' \
            '/System/Library/PrivateFrameworks/libEDR.framework/libEDR' \
            '/System/Library/Frameworks/IOKit.framework/Versions/A/IOKit' \
            '/System/Library/PrivateFrameworks/BackBoardServices.framework/BackBoardServices' \
            '/System/Library/PrivateFrameworks/SpringBoard.framework/SpringBoard'; do
            echo "### $IMAGE" >> "$WORK/out/image-closures.txt"
            "$WORK/bin/ipsw" dyld image "$DSC" "$IMAGE" >> "$WORK/out/image-closures.txt" 2>&1 || true
          done

          "$WORK/bin/ipsw" dyld macho "$DSC" \
            '/System/Library/PrivateFrameworks/IOMobileFramebuffer.framework/IOMobileFramebuffer' \
            --loads --symbols --strings --starts --stubs --demangle \
            --output "$WORK/out/extracted" --extract --force \
            > "$WORK/out/iomfb-macho.txt" 2>&1 || true
          "$WORK/bin/ipsw" dyld macho "$DSC" '/usr/libexec/backboardd' \
            --loads --symbols --strings --starts --stubs --demangle \
            --output "$WORK/out/extracted" --extract --force \
            > "$WORK/out/backboardd-macho.txt" 2>&1 || true

          for SPEC in \
            QuartzCore \
            CoreBrightness \
            libEDR \
            IOKit=/System/Library/Frameworks/IOKit.framework/Versions/A/IOKit \
            BackBoardServices \
            SpringBoard; do
            NAME="${SPEC%%=*}"
            IMAGE="${SPEC#*=}"
            if [ "$IMAGE" = "$SPEC" ]; then IMAGE="$NAME"; fi
            "$WORK/bin/ipsw" dyld macho "$DSC" "$IMAGE" \
              --loads --symbols --strings --starts --stubs --demangle \
              --output "$WORK/out/extracted" --extract --force \
              > "$WORK/out/${NAME}-macho.txt" 2>&1 || true
          done

          # backboardd is a standalone executable in the root filesystem, not an
          # in-cache dylib. Copy it read-only from the verified HFSX mount.
          if sudo test -f "$WORK/mnt/usr/libexec/backboardd"; then
            sudo cp "$WORK/mnt/usr/libexec/backboardd" "$WORK/out/extracted/backboardd"
            sudo chown "$(id -u):$(id -g)" "$WORK/out/extracted/backboardd"
          fi

          python3 - <<'PY' > "$WORK/out/symbols.json"
          import json
          names = [
              "IOMobileFramebufferGetBlock",
              "IOMobileFramebufferGetBlockSize",
              "IOMobileFramebufferSupportedFrameInfo",
              "IOMobileFramebufferFrameInfo",
              "IOMobileFrameBufferGetBlock",
              "IOMobileFramebufferCreate",
              "IOMobileFramebufferSetFB",
              "IOMobileFramebufferSwapBegin",
              "IOMobileFramebufferSwapEnd",
              "IOMobileFramebufferSwapWait",
              "IOMobileFramebufferGetDisplaySize",
              "IOMobileFramebufferGetLayerDefaultSurface",
              "IOMobileFramebufferSetClientCallbacks",
              "IOMobileFramebufferEnable",
              "IOMobileFramebufferDisable",
              "IOConnectCallMethod",
              "IOConnectCallScalarMethod",
              "IOConnectCallStructMethod",
          ]
          print(json.dumps([{"pattern": name} for name in names], indent=2))
          PY
          "$WORK/bin/ipsw" dyld symaddr "$DSC" --in "$WORK/out/symbols.json" --all \
            > "$WORK/out/symaddr.json" 2>&1 || true

          # Resolve the indirect branch/stub islands seen in genuine IOMFB,
          # QuartzCore and CoreBrightness disassembly. These addresses are
          # unslid DSC addresses, not guesses from our kernel stub.
          cat > "$WORK/out/resolve-addresses.txt" <<'EOF'
          0x1afb974bc
          0x1afb974c8
          0x1afb974d4
          0x1afb977e0
          0x1afb95df8
          0x1afb962f0
          0x1afb96344
          0x1afb96350
          0x18dbcc238
          0x18dbcc808
          0x18dbcc8e0
          0x18dbca4f8
          0x18dbca5d0
          0x18dbcd288
          0x18dbcd2ac
          EOF
          : > "$WORK/out/resolved-addresses.txt"
          while read -r ADDR; do
            echo "### $ADDR" >> "$WORK/out/resolved-addresses.txt"
            "$WORK/bin/ipsw" dyld a2s "$DSC" "$ADDR" -i -m \
              >> "$WORK/out/resolved-addresses.txt" 2>&1 || true
            "$WORK/bin/ipsw" dyld a2f "$DSC" "$ADDR" -j \
              >> "$WORK/out/resolved-addresses.txt" 2>&1 || true
          done < "$WORK/out/resolve-addresses.txt"
          "$WORK/bin/ipsw" dyld stubs "$DSC" 2>&1 | gzip -9 > "$WORK/out/dyld-stubs.txt.gz" || true

          "$WORK/bin/ipsw" dyld disass "$DSC" \
            --image '/System/Library/PrivateFrameworks/IOMobileFramebuffer.framework/IOMobileFramebuffer' \
            --quiet --force > "$WORK/out/iomfb-disasm.txt" 2>&1 || true
          "$WORK/bin/ipsw" dyld disass "$DSC" --image '/usr/libexec/backboardd' \
            --quiet --force > "$WORK/out/backboardd-disasm.txt" 2>&1 || true

          for FILE in iomfb-disasm.txt backboardd-disasm.txt; do
            test -s "$WORK/out/$FILE" || { echo "$FILE is empty" >&2; exit 1; }
            echo "### $FILE head"
            head -5 "$WORK/out/$FILE"
            echo "### $FILE lines"
            wc -l < "$WORK/out/$FILE"
          done
          find "$WORK/out/extracted" -type f -printf '%P %s bytes\n' | sort \
            | tee "$WORK/out/extracted-files.txt"

          grep -n -i -E 'GetBlock|SupportedFrameInfo|FrameInfo|IOMobileFramebuffer|IOMFB' \
            "$WORK/out/backboardd-disasm.txt" \
            > "$WORK/out/backboardd-iomfb-refs.txt" 2>&1 || true
          grep -n -i -E 'GetBlock|SupportedFrameInfo|FrameInfo|externalMethod|IORPC|selector' \
            "$WORK/out/iomfb-disasm.txt" \
            > "$WORK/out/iomfb-key-refs.txt" 2>&1 || true
          gzip -9 "$WORK/out/iomfb-disasm.txt" "$WORK/out/backboardd-disasm.txt"

          sudo umount "$WORK/mnt"
          find "$WORK/out" -type f -printf '%P %s bytes\n' | sort | tee "$WORK/out/manifest-files.txt"
          (cd "$WORK/out" && sha256sum $(find . -type f -printf '%P\n' | sort)) > "$WORK/out/SHA256SUMS"

      - name: Upload ABI evidence
        uses: actions/upload-artifact@v4
        with:
          name: ios-abi-evidence
          path: ${{ env.WORK }}/out
          if-no-files-found: error
