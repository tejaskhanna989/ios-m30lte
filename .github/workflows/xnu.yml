    - name: Copy config files to build directory
      run: "cd xnu-source\necho \"=== Copying config files to build directory ===\"\nmkdir -p BUILD/obj/DEVELOPMENT_ARM64_M30LTE/config\ncp config/* BUILD/obj/DEVELOPMENT_ARM64_M30LTE/config/ 2>/dev/null || true\nls -la BUILD/obj/DEVELOPMENT_ARM64_M30LTE/config/*.exports 2>/dev/null | head -20 || echo \"No export files copied\"\nls -la BUILD/obj/DEVELOPMENT_ARM64_M30LTE/config/ 2>/dev/null | head -30 || echo \"No files copied\"\n"
    - name: Generate component .filelist files
      run: "cd xnu-source\necho \"=== Generating .filelist files for all components ===\"\nfor comp in osfmk bsd libkern iokit pexpert libsa san security; do\n  mkdir -p BUILD/obj/DEVELOPMENT_ARM64_M30LTE/$comp/DEVELOPMENT\n  touch BUILD/obj/DEVELOPMENT_ARM64_M30LTE/$comp/DEVELOPMENT/$comp.filelist\n  echo \"Created empty $comp.filelist\"\ndone\n"
    - name: Create all export files and filelists for kernel build
      run: "cd xnu-source\necho \"=== Creating all export and filelist files ===\"\n# Copy all export files to build config directory\nmkdir -p BUILD/obj/DEVELOPMENT_ARM64_M30LTE/config\ncp config/*.exports BUILD/obj/DEVELOPMENT_ARM64_M30LTE/config/ 2>/dev/null || true\n# Create empty .filelist files for all components\nfor comp in osfmk bsd libkern iokit pexpert libsa san security; do\n  mkdir -p BUILD/obj/DEVELOPMENT_ARM64_M30LTE/$comp/DEVELOPMENT\n  touch BUILD/obj/DEVELOPMENT_ARM64_M30LTE/$comp/DEVELOPMENT/$comp.filelist\n  echo \"Created $comp.filelist\"\ndone\n# Create empty all-kpi.exp\ntouch BUILD/obj/DEVELOPMENT_ARM64_M30LTE/all-kpi.exp\necho \"Created all-kpi.exp\"\n"
    - name: Verify component conf Makefiles replaced
      run: |
        cd xnu-source
        echo "=== Verifying component conf Makefiles ==="
        for comp in bsd iokit osfmk pexpert libkern libsa san security; do
          echo "Checking $comp/conf/Makefile..."
          if [ ! -f "$comp/conf/Makefile" ]; then
            echo "ERROR: $comp/conf/Makefile does not exist!"
            exit 1
          fi
          # Check for our generated Makefile markers
          if grep -q "SRCROOT := /Users/runner/work/ios-m30lte/ios-m30lte/xnu-source" "$comp/conf/Makefile"; then
            echo "OK: $comp/conf/Makefile has hardcoded SRCROOT"
          else
            echo "WARNING: $comp/conf/Makefile may not be the generated version"
            head -25 "$comp/conf/Makefile"
          fi
        done
    - name: Build XNU kernel
      id: build_kernel
      run: "cd xnu-source\nSYSCTL_PHYSICALCPU=$(/usr/sbin/sysctl -n hw.physicalcpu)\n\
        SYSCTL_LOGICALCPU=$(/usr/sbin/sysctl -n hw.logicalcpu)\nMEMORY_SIZE=$(/usr/sbin/sysctl\
        \ -n hw.memsize)\necho \"SYSCTL_PHYSICALCPU=$SYSCTL_PHYSICALCPU SYSCTL_LOGICALCPU=$SYSCTL_LOGICALCPU\
        \ MEMORY_SIZE=$MEMORY_SIZE\"\necho \"=== Building XNU kernel (default target)\
        \ ===\"\n# Build with explicit linker verbose output, capture all sub-make\
        \ output\n# Do NOT use set -o pipefail - it kills the script before we capture\
        \ PIPESTATUS\n# Environment variables are now set at job level for all steps\n\
        export DRIVERKIT=0\nmake -e VERBOSE=YES \\\n  SDKROOT=iphoneos \\\n  HOST_SDKROOT=macosx\
        \ \\\n  HOST_OS_VERSION=26.0 \\\n  TARGET_CONFIGS=\"DEVELOPMENT ARM64 M30LTE\"\
        \ \\\n  CURRENT_KERNEL_CONFIG=DEVELOPMENT \\\n  CURRENT_ARCH_CONFIG=ARM64\
        \ \\\n  CURRENT_MACHINE_CONFIG=M30LTE \\\n  CURRENT_MACHINE_CONFIG_LC=m30lte\
        \ \\\n  SRCROOT=\"$PWD\" \\\n  OBJROOT=\"$PWD/BUILD/obj\" \\\n  SYMROOT=\"$PWD/BUILD/sym\" \\\n \
        \ DSTROOT=\"$PWD/fakeroot\" \\\n  FAKEROOT_DIR=\"$PWD/fakeroot\" \\\n  KDKROOT=\"\
        /Library/Developer/KDKs\" \\\n  TIGHTBEAMC=\"\" \\\n  RC_DARWIN_KERNEL_VERSION=\"\
        22.6.0\" \\\n  MEMORY_SIZE=\"${MEMORY_SIZE}\" \\\n  SYSCTL_HW_PHYSICALCPU=\"\
        ${SYSCTL_PHYSICALCPU}\" \\\n  SYSCTL_HW_LOGICALCPU=\"${SYSCTL_LOGICALCPU}\"\
        \ \\\n  KERNEL_BUILDS_IN_PARALLEL=1 \\\n  BUILD_WERROR=0 BUILD_LTO=0 CONCISE=0\
        \ LOGCOLORS=y \\\n  DRIVERKIT=0 \\\n  SETUP_SUBDIRS=\"\" \\\n  MACH_KERNEL_PRIVATE=1 \\\n  RC_NONARCH_CFLAGS=\"-DKERNEL -DMACH_KERNEL_PRIVATE -DKERNEL_PRIVATE -DXNU_KERNEL_PRIVATE -DPRIVATE\" \\\n  2>&1 | tee\
        \ /tmp/xnu-build.log\nBUILD_EXIT=${PIPESTATUS[0]}\necho \"make exit code:\
        \ $BUILD_EXIT\"\necho \"=== Errors in build log ===\"\ngrep -iE \"error:|error\
        \ |make: \\*\\*\\*|No rule|syntax error|undefined reference|missing separator|command\
        \ not found|ld:|symbol|library not found|collect2\" /tmp/xnu-build.log | head\
        \ -50 || echo \"No errors found in log\"\necho \"=== Last 1000 lines of build\
        \ log ===\"\ntail -1000 /tmp/xnu-build.log\necho \"=== Kernel artifacts ===\"\
        \nfind BUILD/obj -name \"kernel.*\" -type f 2>/dev/null | head -10\nfind BUILD/obj\
        \ -maxdepth 3 \\( -name \"kernel.development.m30lte\" -o -name \"mach_kernel\"\
        \ \\) 2>/dev/null | head -10\necho \"BUILD_EXIT=$BUILD_EXIT\" >> $GITHUB_OUTPUT\n\
        exit $BUILD_EXIT\n"
    - name: Run bsd build to capture linker error
      if: failure()
