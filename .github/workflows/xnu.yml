name: xnu
true:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: '13.5'
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG
        default: M30LTE
  push:
    branches:
    - main
    paths:
    - xnu/patches/**
    - .github/workflows/xnu.yml
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    env:
      MACOS_VERSION: '13.5'
      KERNEL_CONFIG: DEVELOPMENT
      MACHINE_CONFIG: M30LTE
      DRIVERKIT: '0'
      SDKROOT_PATH: /Applications/Xcode_26.0.1.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS26.0.sdk
      CFLAGS: -Wno-format -isysroot /Applications/Xcode_26.0.1.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS26.0.sdk
        -I/Applications/Xcode_26.0.1.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS26.0.sdk/usr/include
      CXXFLAGS: -Wno-format -isysroot /Applications/Xcode_26.0.1.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS26.0.sdk
        -I/Applications/Xcode_26.0.1.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS26.0.sdk/usr/include
      MAKEFLAGS: -j1 -e
      SRCROOT: ${{ github.workspace }}/xnu-source
      CURRENT_KERNEL_CONFIG: DEVELOPMENT
      CURRENT_ARCH_CONFIG: ARM64
      CURRENT_MACHINE_CONFIG: M30LTE
      CURRENT_MACHINE_CONFIG_LC: m30lte
      SDKROOT: iphoneos
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
      KDKROOT: /Library/Developer/KDKs
      OBJROOT: ${{ github.workspace }}/xnu-source/BUILD/obj
    steps:
    - uses: actions/checkout@v4
    - name: Check available Xcode versions
      run: 'echo "=== Checking pre-installed Xcode versions ==="

        ls -la /Applications/Xcode*.app 2>/dev/null || echo "No Xcode apps found"

        echo "=== Checking xcode-select ==="

        xcode-select -p

        xcodebuild -version

        '
    - name: Deps
      run: "brew install jq gum bash cmake ninja\nXC=$(ls -d /Applications/Xcode_15.0.1.app\
        \ 2>/dev/null || ls -d /Applications/Xcode_15.*.app 2>/dev/null | head -1)\n\
        if [ -z \"$XC\" ]; then\n  echo \"Xcode 15 not pre-installed, attempting to\
        \ install via xcodes with Apple ID from secrets...\"\n  printf '#!/bin/sh\\\
        nexit 0\\n' | sudo tee /usr/local/bin/xcodes >/dev/null\n  sudo chmod +x /usr/local/bin/xcodes\n\
        \  brew uninstall xcodes 2>/dev/null || true\n  brew install xcodesorg/made/xcodes\n\
        \  if [ -n \"${{ secrets.APPLE_ID }}\" ] && [ -n \"${{ secrets.APPLE_PASSWORD\
        \ }}\" ]; then\n    xcodes install --latest 15.0.1 --apple-id \"${{ secrets.APPLE_ID\
        \ }}\" --password \"${{ secrets.APPLE_PASSWORD }}\"\n    XC=$(ls -d /Applications/Xcode_15.0.1.app\
        \ 2>/dev/null || ls -d /Applications/Xcode_15.*.app 2>/dev/null | head -1)\n\
        \  else\n    echo \"No Apple ID credentials in secrets. Trying to use pre-installed\
        \ Xcode 26 as fallback...\"\n    XC=$(ls -d /Applications/Xcode_26.*.app 2>/dev/null\
        \ | head -1)\n  fi\nfi\nif [ -z \"$XC\" ]; then\n  echo \"ERROR: No suitable\
        \ Xcode found\"\n  exit 1\nfi\necho \"DEVELOPER_DIR=$XC/Contents/Developer\"\
        \ >> \"$GITHUB_ENV\"\nsudo xcode-select -s \"$XC\"\nxcodebuild -version\n"
    - name: Download KDK
      run: "# Check if KDK is already installed\nif [ -d \"/Library/Developer/KDKs/KernelDebugKit_13.5_build_22G74.kdk\"\
        \ ]; then\n  echo \"KDK already installed at /Library/Developer/KDKs/\"\n\
        \  ls -la /Library/Developer/KDKs/\nelse\n  echo \"KDK not found, downloading...\"\
        \n  # Direct URL from dortania release (known working)\n  KDK_URL=\"https://github.com/dortania/KdkSupportPkg/releases/download/22G74/Kernel_Debug_Kit_13.5_build_22G74.dmg\"\
        \n  echo \"Downloading KDK from: $KDK_URL\"\n  curl -L -o /tmp/KDK.dmg \"\
        ${KDK_URL}\" || {\n    echo \"Primary download failed, trying alternative\
        \ source...\"\n    # Fallback to Apple Developer (requires auth, may fail)\n\
        \    KDK_URL=\"https://developer.apple.com/services-account/download?path=/Developer_Tools/Kernel_Debug_Kit_13.5/Kernel_Debug_Kit_13.5_build_22G74.dmg\"\
        \n    curl -L -o /tmp/KDK.dmg \"${KDK_URL}\"\n  }\n  hdiutil attach /tmp/KDK.dmg\n\
        \  sudo installer -pkg '/Volumes/Kernel Debug Kit/KernelDebugKit.pkg' -target\
        \ /\n  hdiutil detach '/Volumes/Kernel Debug Disk' 2>/dev/null || true\nfi\n\
        # Verify KDK installation\nls -la /Library/Developer/KDKs/\n"
    - name: Verify build environment
      run: 'echo "=== Build Environment Verification ==="

        echo "SRCROOT: ${SRCROOT:-not set}"

        echo "CURRENT_KERNEL_CONFIG: ${CURRENT_KERNEL_CONFIG:-not set}"

        echo "CURRENT_ARCH_CONFIG: ${CURRENT_ARCH_CONFIG:-not set}"

        echo "CURRENT_MACHINE_CONFIG: ${CURRENT_MACHINE_CONFIG:-not set}"

        echo "CURRENT_MACHINE_CONFIG_LC: ${CURRENT_MACHINE_CONFIG_LC:-not set}"

        echo "SDKROOT: ${SDKROOT:-not set}"

        echo "DEVELOPER_DIR: ${DEVELOPER_DIR:-not set}"

        echo "KDKROOT: ${KDKROOT:-not set}"

        echo "OBJROOT: ${OBJROOT:-not set}"

        echo "=== KDK Installation ==="

        ls -la /Library/Developer/KDKs/ 2>/dev/null || echo "No KDKs found"

        echo "=== SDKROOT ==="

        xcrun --sdk macosx --show-sdk-path

        '
    - name: Clone XNU
      run: 'git clone --branch xnu-8796.141.3 --depth 1 https://github.com/apple-oss-distributions/xnu.git
        xnu-source

        cd xnu-source

        git describe --tags --always

        '
    - name: Stage libpthread dependency
      run: 'cd xnu-source

        MACHINE_CONFIG=M30LTE bash ../xnu/patches/0019-stage-libpthread.sh

        '
    - name: Stage BearSSL dependency
      run: 'cd xnu-source

        MACHINE_CONFIG=M30LTE bash ../xnu/patches/0020-stage-bearssl.sh || true

        '
    - name: Apply M30LTE patches
      run: "cd xnu-source\nfor patch in ../xnu/patches/00*.patch; do\n  name=$(basename\
        \ \"$patch\")\n  echo \"Applying: $name\"\n  patch -p1 --no-backup-if-mismatch\
        \ < \"$patch\" 2>&1 || true\ndone\nls -la pexpert/pexpert/arm64/M30LTE.h 2>&1\
        \ || echo \"M30LTE.h NOT FOUND - creating from patch\"\ncat ../xnu/patches/0000-m30lte-machine-config.patch\
        \ | grep -A 50 \"M30LTE.h\" | head -60 || true\n"
    - name: Fix makedefs path in Makefiles
      run: 'echo "=== Fixing /makedefs paths in Makefiles ==="

        cd xnu-source

        python3 ../xnu/fix_makedefs.py .

        # Verify the changes

        grep -r "/makedefs" . --include="Makefile" --include="*.mk" --include="*.mak"
        | head -5 || echo "No more /makedefs references found"

        '
    - name: Force patch proc_reg.h for M30LTE
      run: "cd xnu-source\necho \"=== Force patching proc_reg.h for M30LTE ===\"\n\
        if ! grep -q \"M30LTE\" osfmk/arm64/proc_reg.h; then\n  echo \"M30LTE not\
        \ found in proc_reg.h, applying manually...\"\n  python3 ../xnu/patches/patch_proc_reg.py\n\
        else\n  echo \"M30LTE already defined in proc_reg.h\"\nfi\ngrep -n \"M30LTE\"\
        \ osfmk/arm64/proc_reg.h | head -5\n"
    - name: Create firehose_buffer_private.h for M30LTE
      run: "cd xnu-source\necho \"=== Creating firehose_buffer_private.h for M30LTE\
        \ ===\"\nif [ ! -f osfmk/arm64/firehose_buffer_private.h ]; then\n  echo \"\
        firehose_buffer_private.h not found, creating...\"\n  python3 ../xnu/patches/create_firehose_buffer_private.py\n\
        else\n  echo \"firehose_buffer_private.h already exists\"\nfi\nls -la osfmk/arm64/firehose_buffer_private.h\n\
        mkdir -p BUILD/obj/EXPORT_HDRS/osfmk/arm64\ncp osfmk/arm64/firehose_buffer_private.h\
        \ BUILD/obj/EXPORT_HDRS/osfmk/arm64/\n"
    - name: Fix clang flag incompatibility with Xcode 26
      run: "cd xnu-source\necho \"=== Patching out incompatible clang flags ===\"\n\
        find . -name \"*.def\" -o -name \"Makefile*\" -o -name \"*.mk\" -o -name \"\
        *.inc\" | xargs grep -l \"enable-trivial-auto-var-init-zero-knowing\" 2>/dev/null\
        \ | while read file; do\n  echo \"Patching: $file\"\n  sed -i '' 's/-enable-trivial-auto-var-init-zero-knowing-it-will-be-removed-from-clang//g'\
        \ \"$file\"\ndone\ngrep -r \"enable-trivial-auto-var-init-zero-knowing\" .\
        \ 2>/dev/null | head -5 || echo \"Flag not found in source (may be added at\
        \ build time)\"\n"
    - name: Verify bsd/Makefile structure
      run: 'cd xnu-source

        echo "=== Verifying bsd/Makefile structure ==="

        grep -n "do_all" bsd/Makefile || echo "No do_all target found"

        grep -n "OBJPATH" bsd/Makefile | head -5

        echo "=== First 30 lines of bsd/Makefile ==="

        head -30 bsd/Makefile

        '
    - name: Patch bsd/conf/Makefile do_all to pass SRCROOT/SETUP to sub-make
      run: 'cd xnu-source

        echo "=== Patching bsd/conf/Makefile do_all target to pass SRCROOT/SETUP ==="

        python3 ../xnu/patches/patch_bsd_do_all.py

        # Verify the patch

        grep -A 12 "do_all" bsd/conf/Makefile | head -15

        '
    - name: Fix DriverKit IORPC for Xcode 26
      run: "cd xnu-source\necho \"=== Patching DriverKit IORPC for Xcode 26 compatibility\
        \ ===\"\nif [ -f iokit/DriverKit/IORPC.h ]; then\n  echo \"Patching IORPC.h\
        \ to add kernelContent field...\"\n  python3 ../xnu/patches/patch_iorpc.py\n\
        else\n  echo \"IORPC.h not found, skipping\"\nfi\ngrep -n \"kernelContent\"\
        \ iokit/DriverKit/IORPC.h 2>/dev/null | head -5 || echo \"kernelContent not\
        \ found in IORPC.h\"\n"
    - name: Build bootstrap_cmds (mig)
      run: 'cd xnu-source

        BOOTSTRAP_VERSION=$(curl -s "https://raw.githubusercontent.com/apple-oss-distributions/distribution-macOS/macos-135/release.json"
        | jq -r ''.projects[] | select(.project=="bootstrap_cmds") | .tag'')

        git clone --branch "${BOOTSTRAP_VERSION}" --depth 1 https://github.com/apple-oss-distributions/bootstrap_cmds.git
        bootstrap_cmds

        cd bootstrap_cmds

        sed -i '''' ''s|-o root -g wheel||g'' xcodescripts/install-mig.sh

        xcodebuild install -sdk macosx -project mig.xcodeproj ARCHS="arm64 x86_64"
        CODE_SIGN_IDENTITY="-" OBJROOT="$PWD/../BUILD/bootstrap_cmds.obj" SYMROOT="$PWD/../BUILD/bootstrap_cmds.sym"
        DSTROOT="$PWD/../fakeroot" RC_ProjectNameAndSourceVersion="${BOOTSTRAP_VERSION}"
        2>&1 | tail -20 || true

        '
    - name: Build dtrace (ctf tools)
      run: 'cd xnu-source

        DTRACE_VERSION=$(curl -s "https://raw.githubusercontent.com/apple-oss-distributions/distribution-macOS/macos-135/release.json"
        | jq -r ''.projects[] | select(.project=="dtrace") | .tag'')

        git clone --branch "${DTRACE_VERSION}" --depth 1 https://github.com/apple-oss-distributions/dtrace.git
        dtrace

        cd dtrace

        xcodebuild install -sdk macosx -target ctfconvert -target ctfdump -target
        ctfmerge ARCHS="arm64 x86_64" CODE_SIGN_IDENTITY="-" OBJROOT="$PWD/../BUILD/dtrace.obj"
        SYMROOT="$PWD/../BUILD/dtrace.sym" DSTROOT="$PWD/../fakeroot" 2>&1 | tail
        -20 || true

        '
    - name: Build availability versions
      run: "cd xnu-source\nAVAILABILITYVERSIONS_VERSION=$(curl -s \"https://raw.githubusercontent.com/apple-oss-distributions/distribution-macOS/macos-135/release.json\"\
        \ | jq -r '.projects[] | select(.project==\"AvailabilityVersions\") | .tag')\n\
        git clone --branch \"${AVAILABILITYVERSIONS_VERSION}\" --depth 1 https://github.com/apple-oss-distributions/AvailabilityVersions.git\
        \ AvailabilityVersions\ncd AvailabilityVersions\nmake install -j8 OBJROOT=\"\
        $PWD/../BUILD/\" SYMROOT=\"$PWD/../BUILD/\" DSTROOT=\"$PWD/../fakeroot\" 2>&1\
        \ | tail -20 || true\n# Also install availability.pl to host system location\
        \ for make_symbol_aliasing.sh fallback\nif [ -f \"$PWD/../fakeroot/usr/local/libexec/availability.pl\"\
        \ ]; then\n  echo \"Installing availability.pl to /usr/local/libexec/\"\n\
        \  sudo mkdir -p /usr/local/libexec\n  sudo cp \"$PWD/../fakeroot/usr/local/libexec/availability.pl\"\
        \ /usr/local/libexec/availability.pl\n  sudo chmod +x /usr/local/libexec/availability.pl\n\
        \  echo \"Installed availability.pl to host system\"\nelse\n  echo \"WARNING:\
        \ availability.pl not found in fakeroot\"\n  find \"$PWD/../fakeroot\" -name\
        \ \"availability.pl\" 2>/dev/null || true\nfi\n"
    - name: Create minimal availability.pl for _symbol_aliasing.h
      run: 'cd xnu-source

        echo "=== Creating minimal availability.pl for _symbol_aliasing.h ==="

        sudo mkdir -p /usr/local/libexec

        python3 ../xnu/patches/create_minimal_availability_pl.py > /tmp/availability.pl

        sudo cp /tmp/availability.pl /usr/local/libexec/availability.pl

        sudo chmod +x /usr/local/libexec/availability.pl

        echo "Created minimal availability.pl at /usr/local/libexec/availability.pl"

        # Verify it works

        /usr/local/libexec/availability.pl --ios | head -5

        /usr/local/libexec/availability.pl --macosx | head -5

        '
    - name: Patch make_symbol_aliasing.sh for availability.pl fallback
      run: 'cd xnu-source

        echo "=== Patching make_symbol_aliasing.sh for availability.pl fallback ==="

        python3 ../xnu/patches/patch_availability_fallback.py

        chmod +x bsd/sys/make_symbol_aliasing.sh

        echo "Patched successfully"

        '
    - name: Install xnu headers
      run: 'cd xnu-source

        SYSCTL_PHYSICALCPU=$(/usr/sbin/sysctl -n hw.physicalcpu)

        SYSCTL_LOGICALCPU=$(/usr/sbin/sysctl -n hw.logicalcpu)

        MEMORY_SIZE=$(/usr/sbin/sysctl -n hw.memsize)

        # Only install headers for our target architecture (ARM64 M30LTE), not X86_64
        or VMAPPLE

        make installhdrs -j8 SDKROOT=iphoneos ARCH_CONFIGS="ARM64" MACHINE_CONFIGS="M30LTE"
        OBJROOT="$PWD/BUILD/xnu-hdrs.obj" SYMROOT="$PWD/BUILD/xnu-hdrs.sym" DSTROOT="$PWD/fakeroot"
        FAKEROOT_DIR="$PWD/fakeroot" KDKROOT="/Library/Developer/KDKs" TIGHTBEAMC=""
        RC_DARWIN_KERNEL_VERSION="22.6.0" MEMORY_SIZE="${MEMORY_SIZE}" SYSCTL_HW_PHYSICALCPU="${SYSCTL_PHYSICALCPU}"
        SYSCTL_HW_LOGICALCPU="${SYSCTL_LOGICALCPU}" KERNEL_BUILDS_IN_PARALLEL=1 2>&1
        | tail -20 || true

        '
    - name: Build SETUP tools for macOS (host platform)
      run: "cd xnu-source\necho \"=== Building SETUP tools for macOS (host platform)\
        \ ===\"\n# Build SETUP tools with macOS SDK (host platform)\nmake -C SETUP/config\
        \ clean 2>/dev/null || true\nmake -C SETUP/config \\\n  SDKROOT=macosx \\\n\
        \  HOST_SDKROOT=macosx \\\n  HOST_OS_VERSION=26.0 \\\n  OBJROOT=\"$PWD/BUILD/obj\"\
        \ \\\n  SYMROOT=\"$PWD/BUILD/sym\" \\\n  DSTROOT=\"$PWD/fakeroot\" \\\n  FAKEROOT_DIR=\"\
        $PWD/fakeroot\" \\\n  KDKROOT=\"/Library/Developer/KDKs\" \\\n  SRCROOT=\"\
        $PWD\" \\\n  CURRENT_KERNEL_CONFIG=DEVELOPMENT \\\n  CURRENT_ARCH_CONFIG=ARM64\
        \ \\\n  CURRENT_MACHINE_CONFIG=M30LTE \\\n  CURRENT_MACHINE_CONFIG_LC=m30lte\
        \ \\\n  do_build_setup 2>&1 | tail -20\n# Copy built tools to main build directory\n\
        mkdir -p BUILD/obj/SETUP/config\ncp -v SETUP/config/config BUILD/obj/SETUP/config/\
        \ 2>/dev/null || true\ncp -v SETUP/config/*.o BUILD/obj/SETUP/config/ 2>/dev/null\
        \ || true\necho \"SETUP tools built and copied for macOS\""
    - name: Pre-build IORPC patch for DriverKit
      run: 'cd xnu-source

        echo "=== Pre-build IORPC patch for DriverKit ==="

        python3 ../xnu/patches/patch_all_iorpc.py

        '
    - name: Patch SETUP/config/Makefile for VPATH
      run: 'cd xnu-source

        echo "=== Patching SETUP/config/Makefile for VPATH ==="

        python3 ../xnu/patches/patch_setup_config_vpath.py

        echo "Patched successfully"

        '
    - name: Fix SETUP tool include paths
      run: 'cd xnu-source

        echo "=== Fixing SETUP tool include paths ==="

        SDKROOT_PATH=$(xcrun --sdk iphoneos --show-sdk-path)

        echo "SDKROOT_PATH=$SDKROOT_PATH"

        export SDKROOT_PATH

        python3 ../xnu/patches/fix_setup_tool_includes.py

        echo "Fixed successfully"

        '
    - name: Fix makedefs paths in build directory
      run: 'echo "=== Fixing /makedefs paths in build directory ==="

        cd /Users/runner/work/ios-m30lte/ios-m30lte/xnu-source

        python3 ../xnu/fix_makedefs.py BUILD/obj

        # Verify the changes

        grep -r "/makedefs" BUILD/obj --include="Makefile" --include="*.mk" --include="*.mak"
        | head -5 || echo "No more /makedefs references found in build directory"

        # Verify the patch

        '
    - name: Copy SETUP/config sources to build directory
      run: 'cd xnu-source

        echo "=== Copying SETUP/config sources to build directory ==="

        mkdir -p BUILD/obj/SETUP/config

        cp -v SETUP/config/*.c SETUP/config/*.h SETUP/config/*.y SETUP/config/*.l
        BUILD/obj/SETUP/config/ 2>/dev/null || true

        ls -la BUILD/obj/SETUP/config/

        '
    - name: Build XNU kernel
      id: build_kernel
      run: "cd xnu-source\nSYSCTL_PHYSICALCPU=$(/usr/sbin/sysctl -n hw.physicalcpu)\n\
        SYSCTL_LOGICALCPU=$(/usr/sbin/sysctl -n hw.logicalcpu)\nMEMORY_SIZE=$(/usr/sbin/sysctl\
        \ -n hw.memsize)\necho \"SYSCTL_PHYSICALCPU=$SYSCTL_PHYSICALCPU SYSCTL_LOGICALCPU=$SYSCTL_LOGICALCPU\
        \ MEMORY_SIZE=$MEMORY_SIZE\"\necho \"=== Building XNU kernel (default target)\
        \ ===\"\n# Build with explicit linker verbose output, capture all sub-make\
        \ output\n# Do NOT use set -o pipefail - it kills the script before we capture\
        \ PIPESTATUS\n# Environment variables are now set at job level for all steps\n\
        make -e VERBOSE=YES \\\n  SDKROOT=iphoneos \\\n  TARGET_CONFIGS=\"DEVELOPMENT\
        \ ARM64 M30LTE\" \\\n  CURRENT_KERNEL_CONFIG=DEVELOPMENT \\\n  CURRENT_ARCH_CONFIG=ARM64\
        \ \\\n  CURRENT_MACHINE_CONFIG=M30LTE \\\n  CURRENT_MACHINE_CONFIG_LC=m30lte\
        \ \\\n  OBJROOT=\"$PWD/BUILD/obj\" \\\n  SYMROOT=\"$PWD/BUILD/sym\" \\\n \
        \ DSTROOT=\"$PWD/fakeroot\" \\\n  FAKEROOT_DIR=\"$PWD/fakeroot\" \\\n  KDKROOT=\"\
        /Library/Developer/KDKs\" \\\n  TIGHTBEAMC=\"\" \\\n  RC_DARWIN_KERNEL_VERSION=\"\
        22.6.0\" \\\n  MEMORY_SIZE=\"${MEMORY_SIZE}\" \\\n  SYSCTL_HW_PHYSICALCPU=\"\
        ${SYSCTL_PHYSICALCPU}\" \\\n  SYSCTL_HW_LOGICALCPU=\"${SYSCTL_LOGICALCPU}\"\
        \ \\\n  KERNEL_BUILDS_IN_PARALLEL=1 \\\n  BUILD_WERROR=0 BUILD_LTO=0 CONCISE=0\
        \ LOGCOLORS=y \\\n  DRIVERKIT=0 \\\n  2>&1 | tee /tmp/xnu-build.log\nBUILD_EXIT=${PIPESTATUS[0]}\n\
        echo \"make exit code: $BUILD_EXIT\"\necho \"=== Errors in build log ===\"\
        \ngrep -iE \"error:|error |make: \\*\\*\\*|No rule|syntax error|undefined\
        \ reference|missing separator|command not found|ld:|symbol|library not found|collect2\"\
        \ /tmp/xnu-build.log | head -50 || echo \"No errors found in log\"\necho \"\
        === Last 1000 lines of build log ===\"\ntail -1000 /tmp/xnu-build.log\necho\
        \ \"=== Kernel artifacts ===\"\nfind BUILD/obj -name \"kernel.*\" -type f\
        \ 2>/dev/null | head -10\nfind BUILD/obj -maxdepth 3 \\( -name \"kernel.development.m30lte\"\
        \ -o -name \"mach_kernel\" \\) 2>/dev/null | head -10\necho \"BUILD_EXIT=$BUILD_EXIT\"\
        \ >> $GITHUB_OUTPUT\nexit $BUILD_EXIT\n"
    - name: Run bsd build to capture linker error
      if: failure()
      run: "echo \"=== Main build failed, running bsd link step to capture linker\
        \ error ===\"\n# Re-apply makedefs fix to source directory to ensure it's\
        \ current\ncd /Users/runner/work/ios-m30lte/ios-m30lte/xnu-source\npython3\
        \ ../xnu/fix_makedefs.py .\n# VERIFY: Print the bsd/Makefile lines that are\
        \ failing\necho \"=== VERIFICATION: bsd/Makefile lines 1-10 ===\"\nhead -10\
        \ bsd/Makefile\necho \"=== VERIFICATION: bsd/Makefile lines 90-100 ===\"\n\
        sed -n '90,100p' bsd/Makefile\necho \"=== VERIFICATION: Checking for any remaining\
        \ /makedefs/ ===\"\ngrep -n \"/makedefs\" bsd/Makefile || echo \"No /makedefs/\
        \ found in bsd/Makefile\"\n# Run the EXACT sub-make command from the parent\
        \ build (with -C to build obj dir)\n# CRITICAL: Export SRCROOT to environment\
        \ AND use -e so it propagates to ALL sub-makes (bsd/conf, SETUP, etc.)\n#\
        \ DO NOT pass SRCROOT on command line - it overrides env var and doesn't propagate\
        \ to sub-makes\nexport SRCROOT=\"/Users/runner/work/ios-m30lte/ios-m30lte/xnu-source\"\
        \n/Applications/Xcode_26.0.1.app/Contents/Developer/usr/bin/make -e \\\n \
        \ -C \"/Users/runner/work/ios-m30lte/ios-m30lte/xnu-source/BUILD/obj/DEVELOPMENT_ARM64_M30LTE/bsd\"\
        \ \\\n  -f \"/Users/runner/work/ios-m30lte/ios-m30lte/xnu-source/bsd/Makefile\"\
        \ \\\n  CURRENT_KERNEL_CONFIG=DEVELOPMENT \\\n  CURRENT_ARCH_CONFIG=ARM64\
        \ \\\n  CURRENT_MACHINE_CONFIG=M30LTE \\\n  CURRENT_BUILD_CONFIG=DEVELOPMENT^ARM64^M30LTE\
        \ \\\n  SOURCE=\"/Users/runner/work/ios-m30lte/ios-m30lte/xnu-source/bsd/\"\
        \ \\\n  RELATIVE_SOURCE_PATH=\"./bsd\" \\\n  TARGET=/Users/runner/work/ios-m30lte/ios-m30lte/xnu-source/BUILD/obj/DEVELOPMENT_ARM64_M30LTE/.\
        \ \\\n  OBJPATH=/Users/runner/work/ios-m30lte/ios-m30lte/xnu-source/BUILD/obj/DEVELOPMENT_ARM64_M30LTE\
        \ \\\n  VERBOSE=YES \\\n  build_all 2>&1 | tee /tmp/bsd-build.log\nBSD_EXIT=${PIPESTATUS[0]}\n\
        echo \"bsd build exit code: ${BSD_EXIT}\"\necho \"=== Full bsd build log ===\"\
        \ncat /tmp/bsd-build.log\n# Copy to workspace for artifact upload\ncp /tmp/bsd-build.log\
        \ /Users/runner/work/ios-m30lte/ios-m30lte/bsd-build.log\nls -la /Users/runner/work/ios-m30lte/ios-m30lte/bsd-build.log\n\
        echo \"BSD_EXIT=$BSD_EXIT\" >> $GITHUB_OUTPUT\n"
    - name: Upload bsd build log
      if: always()
      run: 'cp /Users/runner/work/ios-m30lte/ios-m30lte/bsd-build.log bsd-build.log
        2>/dev/null || true

        ls -la bsd-build.log 2>/dev/null || echo "bsd-build.log not found"

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: bsd-build-log
        path: bsd-build.log
        if-no-files-found: warn
    - name: Upload build log
      if: always()
      run: 'cp /tmp/xnu-build.log xnu-build.log 2>/dev/null || true

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: xnu-build-log
        path: xnu-build.log
        if-no-files-found: warn
    - name: Collect kernel artifact
      if: always()
      run: "mkdir -p out\necho \"=== Searching for kernel binary ===\"\nfind xnu-source/BUILD/obj\
        \ -name \"*kernel*\" -type f 2>/dev/null | head -20\necho \"=== Checking for\
        \ any kernel binary ===\"\nKERNEL_PATH=$(find xnu-source/BUILD/obj -maxdepth\
        \ 5 -name \"kernel.development.m30lte\" -o -name \"mach_kernel\" -o -name\
        \ \"kernel\" 2>/dev/null | head -1)\nif [ -n \"$KERNEL_PATH\" ]; then\n  echo\
        \ \"Found kernel at: $KERNEL_PATH\"\n  cp \"$KERNEL_PATH\" out/kernel.development.m30lte\n\
        fi\nls -la out\nif [ -f out/kernel.development.m30lte ]; then\n  (cd out &&\
        \ shasum -a 256 kernel.development.m30lte > SHA256SUMS)\nfi\n"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: xnu-kernel
        path: out/
        if-no-files-found: warn
