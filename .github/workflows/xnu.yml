name: xnu

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG
        default: M30LTE
  push:
    branches: [main]
    paths:
      - "xnu/patches/**"
      - ".github/workflows/xnu.yml"

concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'M30LTE' }}

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Download KDK
        run: |
          KDK_NAME='Kernel Debug Kit 13.5 build 22G74'
          KDK_URL=$(curl -s "https://raw.githubusercontent.com/dortania/KdkSupportPkg/gh-pages/manifest.json" | jq -r --arg KDK_NAME "$KDK_NAME" '.[] | select(.name==$KDK_NAME) | .url')
          curl -L -o /tmp/KDK.dmg "${KDK_URL}"
          hdiutil attach /tmp/KDK.dmg
          sudo installer -pkg '/Volumes/Kernel Debug Kit/KernelDebugKit.pkg' -target /
          hdiutil detach '/Volumes/Kernel Debug Disk'

      - name: Clone XNU
        run: |
          git clone --branch xnu-8796.141.3 --depth 1 https://github.com/apple-oss-distributions/xnu.git xnu
          cd xnu
          git describe --tags --always

      - name: Apply M30LTE patches
        run: |
          cd xnu
          for patch in ../xnu/patches/00*.patch; do
            name=$(basename "$patch")
            echo "Applying: $name"
            patch -p1 --no-backup-if-mismatch --forward < "$patch" 2>&1 | tail -3 || true
          done

      - name: Build XNU kernel
        run: |
          cd xnu
          make build_all -j8 VERBOSE=YES \
            SDKROOT=macosx \
            TARGET_CONFIGS="DEVELOPMENT ARM64 M30LTE" \
            SRCROOT="$PWD" \
            OBJROOT="$PWD/BUILD/obj" \
            SYMROOT="$PWD/BUILD/sym" \
            DSTROOT="$PWD/BUILD/dst" \
            BUILD_WERROR=0 BUILD_LTO=0 CONCISE=0 LOGCOLORS=y \
            2>&1 | tee /tmp/xnu-build.log | tail -100 || true
          echo "=== Kernel artifacts ==="
          find BUILD/obj -name "kernel.*" -type f 2>/dev/null | head -10
          find BUILD/obj -maxdepth 3 \( -name "kernel.development.m30lte" -o -name "mach_kernel" \) 2>/dev/null | head -10

      - name: Collect kernel artifact
        if: always()
        run: |
          mkdir -p out
          KERNEL_PATH=$(find xnu/BUILD/obj -maxdepth 4 -name "kernel.development.m30lte" -o -name "mach_kernel" 2>/dev/null | head -1)
          if [ -n "$KERNEL_PATH" ]; then
            cp "$KERNEL_PATH" out/kernel.development.m30lte
          fi
          ls -la out
          if [ -f out/kernel.development.m30lte ]; then
            (cd out && shasum -a 256 kernel.development.m30lte > SHA256SUMS)
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn