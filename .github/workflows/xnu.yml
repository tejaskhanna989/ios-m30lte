        \ DO NOT pass SRCROOT on command line - it overrides env var and doesn't propagate\
        \ to sub-makes\nexport SRCROOT=\"/Users/runner/work/ios-m30lte/ios-m30lte/xnu-source\"\
        \n/Applications/Xcode_26.0.1.app/Contents/Developer/usr/bin/make -e \\\n \
        \ -C \"/Users/runner/work/ios-m30lte/ios-m30lte/xnu-source/BUILD/obj/DEVELOPMENT_ARM64_M30LTE/bsd\"\
        \ \\\n  -f \"/Users/runner/work/ios-m30lte/ios-m30lte/xnu-source/bsd/Makefile\"\
        \ \\\n  CURRENT_KERNEL_CONFIG=DEVELOPMENT \\\n  CURRENT_ARCH_CONFIG=ARM64\
        \ \\\n  CURRENT_MACHINE_CONFIG=M30LTE \\\n  CURRENT_BUILD_CONFIG=DEVELOPMENT^ARM64^M30LTE\
        \ \\\n  SOURCE=\"/Users/runner/work/ios-m30lte/ios-m30lte/xnu-source/bsd/\"\
