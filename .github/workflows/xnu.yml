name: M30LTE XNU Kernel Build
'on':
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: '13.5'
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG (M30LTE = Galaxy M30)
        default: M30LTE
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: 'true'
      runner:
        description: GitHub runner image (empty = macos-15-intel)
        default: ''
      xnu_target:
        description: XNU target SDK (iphoneos = genuine iOS 16, macosx = legacy reference)
        default: 'iphoneos'
      ui_exact:
        description: 'true = exclude post-v68 diagnostic patches (0453/0454/0455) for exact v68 UI path'
        default: 'false'
concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true
env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'M30LTE' }}
  XNU_TARGET: ${{ inputs.xnu_target || 'iphoneos' }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runner && format('["{0}"]', inputs.runner) || '["macos-15-intel"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v4
    - name: Fetch build script
      run: |
        git init -q dxb
        git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
        git -C dxb checkout -q FETCH_HEAD
        cp xnu/patches-minimal/*.patch xnu/patches-minimal/*.sh dxb/patches/ 2>/dev/null || true
        if [ "${{ inputs.ui_exact }}" = "true" ]; then
          rm -f dxb/patches/0453-m30-ui-heartbeat.patch \
                dxb/patches/0454-m30-ui-hb-framebuffer.patch \
                dxb/patches/0455-m30-lockscreen-diag.patch
          echo "UI_EXACT: post-v68 diagnostic patches excluded"
        fi
        python3 tools/patch_build_sh.py dxb/build.sh "$MACHINE_CONFIG"
        if [ "$XNU_TARGET" = "iphoneos" ]; then
          python3 tools/patch_build_sh_ios.py dxb/build.sh
          echo "XNU_TARGET=$XNU_TARGET -> SDKROOT=iphoneos (XNU_TARGET_OS_IOS)"
        else
          echo "XNU_TARGET=$XNU_TARGET -> legacy macosx reference"
        fi
        echo "=== XNU kernel make lines ==="
        grep -n "make install -j8 VERBOSE=YES" dxb/build.sh
    - name: Deps
      run: |
        brew install jq gum bash cmake ninja
        printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
        sudo chmod +x /usr/local/bin/xcodes
        sw_vers
        ls -d /Applications/Xcode*.app
        XC=$(ls -d /Applications/Xcode_15*.app 2>/dev/null | sort -V | tail -1)
        [ -n "$XC" ] || XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
        echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
        sudo xcode-select -s "$XC"
        xcodebuild -version
        xcrun --find iig
    - name: Diagnose KDK availability
      run: |
        echo "=== Checking KDK availability ==="
        echo "MACOS_VERSION=13.5"
        echo "Expected KDKROOT: /Library/Developer/KDKs/KDK_13.5_22G74.kdk"
        ls -la /Library/Developer/KDKs/ 2>/dev/null || echo "KDKs directory not found"
        if [ -d "/Library/Developer/KDKs/KDK_13.5_22G74.kdk" ]; then
          echo "KDK_13.5_22G74.kdk FOUND"
          ls -la "/Library/Developer/KDKs/KDK_13.5_22G74.kdk/"
        else
          echo "KDK_13.5_22G74.kdk NOT FOUND"
          echo "Available KDKs:"
          find /Library/Developer/KDKs -maxdepth 1 -type d 2>/dev/null | head -20
        fi
    - name: Build
      working-directory: dxb
      env:
        MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
      run: |
        set -o pipefail
        # Export the patch manifest path and the allow-list so the strict loop
        # records every patch it applies. The allow-list is the single
        # documented place a skip can be justified.
        export PATCH_MANIFEST="$PWD/../m30-patch-manifest.tsv"
        export M30_PATCH_ALLOW_SKIP="$(grep -v '^#' "$PWD/../xnu/patches-minimal/SKIP-ALLOWLIST.txt" \
          | grep -v '^$' | cut -f1 | tr '\n' ' ')"
        : > "$PATCH_MANIFEST"
        bash build.sh 2>&1 | tee ../build.log
    - name: Verify libfirehose_kernel is iOS arm64
      if: env.XNU_TARGET == 'iphoneos'
      working-directory: dxb
      run: |
        echo "=== libfirehose_kernel.a object platforms ==="
        for obj in $(find build/libfirehose_kernel.obj -name '*.o' | head -5); do
          echo "-- $obj"
          xcrun llvm-lipo -archs "$obj" 2>/dev/null || true
          otool -l "$obj" 2>/dev/null | grep -A2 LC_BUILD_VERSION | head -4 || true
        done
        echo "=== archive presence ==="
        ls -la fakeroot/usr/local/lib/kernel/libfirehose_kernel.a
    - name: Verify MakeInc.def has M30LTE
      run: |
        echo "=== SUPPORTED_ARM64_MACHINE_CONFIGS ==="
        grep "SUPPORTED_ARM64_MACHINE_CONFIGS" dxb/xnu/makedefs/MakeInc.def
        echo "=== MACHINE_FLAGS_ARM64_M30LTE ==="
        grep "MACHINE_FLAGS_ARM64_M30LTE" dxb/xnu/makedefs/MakeInc.def
    - name: Verify effective M30 source tree
      run: |
        set -o pipefail
        python3 tools/verify_m30_buildtree.py \
          --tree dxb/xnu \
          --patch-dir dxb/patches | tee m30-buildtree-verification.json
    - name: Verify strict patch provenance (all patches, not just 0442-0445)
      run: |
        set -o pipefail
        python3 tools/verify_patch_provenance.py \
          --manifest m30-patch-manifest.tsv \
          --patch-dir xnu/patches-minimal \
          --upstream-dir dxb/patches \
          --allowlist xnu/patches-minimal/SKIP-ALLOWLIST.txt \
          --kernel-sha256 "$(shasum -a 256 "dxb/build/$(ls dxb/build | head -1)" 2>/dev/null | cut -d' ' -f1 || echo unknown)" \
          --json m30-patch-provenance.json
    - name: Parse build log patch evidence
      run: |
        # Independent of the manifest's own bookkeeping. Writes a small JSON of
        # what the build log says actually happened, so the assertions below can
        # each fail on their own, under a name that states the defect.
        python3 - <<'PY'
        import json, re
        from pathlib import Path
        raw = Path("build.log").read_text(errors="ignore")
        # build.sh colourises output; the error-report step strips ANSI for the
        # same reason. Without it "Allowed skip" never matches.
        log = re.sub(r"\x1b\[[0-9;]*[A-Za-z]", "", raw)
        # build.sh sets PATCH_DIR per MACOS_VERSION. For this workflow's 13.5
        # that is the TOP LEVEL of patches/ only; patches/14.4, /15.0 and /26.0
        # sit on disk but are never iterated.
        ours = {p.name for p in Path("xnu/patches-minimal").glob("*.patch")}
        upstream = {p.name for p in Path("dxb/patches").glob("*.patch")}
        applied = set(re.findall(r"Applying patch: .*/([^/\s]+\.patch)", log))
        # Our strict loop REPLACES upstream's for-loop, so a tolerated failure
        # reads "Allowed skip of <name>" (no path); upstream's own spelling is
        # "Skipping patch <path>". Accept both.
        skipped = set(re.findall(r"Skipping patch .*/([^/\s]+\.patch)", log))
        skipped |= set(re.findall(r"Allowed skip of ([^\s(]+\.patch)", log))
        allow = Path("xnu/patches-minimal/SKIP-ALLOWLIST.txt")
        allowed, out_of_tree = set(), set()
        if allow.is_file():
            for line in allow.read_text().splitlines():
                if not line.strip() or line.startswith("#") or "\t" not in line:
                    continue
                n, reason = line.split("\t", 1)
                n = n.strip()
                allowed.add(n)
                # A patch that is not a kernel build input (e.g. it edits a
                # host-side tool) is expected to skip. Everything else of ours
                # must be in the kernel image.
                if reason.strip().startswith("OUT-OF-TREE:"):
                    out_of_tree.add(n)
        Path("patch-evidence.json").write_text(json.dumps({
            "raw_bytes": len(raw), "ansi_stripped": len(raw) - len(log),
            "ours": sorted(ours), "upstream": sorted(upstream),
            "applied": sorted(applied), "skipped": sorted(skipped),
            "allowed": sorted(allowed), "out_of_tree": sorted(out_of_tree),
        }))
        print(f"log {len(raw)}B, {len(applied)} applied, {len(skipped)} skipped, "
              f"{len(ours)} ours, {len(upstream)} upstream")
        PY
    - name: Every patch on disk is applied or allow-listed
      run: |
        python3 - <<'PY'
        import json
        e = json.load(open("patch-evidence.json"))
        missing = [n for n in e["ours"] + e["upstream"]
                   if n not in e["applied"] and n not in e["allowed"]]
        if missing:
            raise SystemExit(f"ERROR: {len(missing)} patch(es) neither applied nor "
                             f"allow-listed: {missing[:6]}")
        print(f"PASS: all {len(e['ours']) + len(e['upstream'])} patches accounted for")
        PY
    - name: No OUR patch was skipped
      run: |
        python3 - <<'PY'
        import json
        e = json.load(open("patch-evidence.json"))
        # A skipped patch of ours is a build that does not contain our work.
        skipped = set(e["skipped"])
        exempt = set(e["out_of_tree"])
        bad = sorted((set(e["ours"]) & skipped) - exempt)
        if bad:
            raise SystemExit(f"ERROR: our patch(es) skipped, not applied, and not "
                             f"marked OUT-OF-TREE: {bad}")
        print(f"PASS: no kernel patch of ours was skipped "
              f"({len(exempt)} out-of-tree exempt)")
        PY
    - name: No patch was silently skipped
      run: |
        python3 - <<'PY'
        import json
        e = json.load(open("patch-evidence.json"))
        bad = sorted(set(e["skipped"]) - set(e["allowed"]))
        if bad:
            raise SystemExit(f"ERROR: skipped without an allow-list entry: {bad}")
        print(f"PASS: all {len(e['skipped'])} skips are justified")
        PY
    - name: Every applied patch exists on disk
      run: |
        python3 - <<'PY'
        import json
        e = json.load(open("patch-evidence.json"))
        phantom = sorted(set(e["applied"]) - set(e["ours"]) - set(e["upstream"]))
        if phantom:
            raise SystemExit(f"ERROR: applied but not in tree: {phantom}")
        print(f"PASS: {len(e['applied'])} applied patches all exist on disk")
        PY
    - name: Upload patch evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: m30-patch-evidence
        path: patch-evidence.json
        if-no-files-found: warn
    - name: Verify M30 Melfas touch patch applied
      run: |
        p=0451-m30-melfas-touch.patch
        grep -q "Applying patch: .*$p" build.log
        if grep -q "Skipping patch .*$p" build.log; then
          echo "ERROR: patch $p was skipped by the tolerant build script"
          exit 1
        fi
        python3 - <<'PY'
        import hashlib
        from pathlib import Path
        rel = "bsd/dev/m30lte_touch.c"
        want = "0240f7c6166a251d8397bcfebb80b29c65edb611f0da182cc2c3afc5c7cdfc94"
        got = hashlib.sha256((Path("dxb/xnu") / rel).read_bytes()).hexdigest()
        if got != want:
            raise SystemExit(f"ERROR: {rel} sha256 {got} != {want}")
        print(f"PASS {rel} {got}")
        src = (Path("dxb/xnu") / rel).read_text()
        assert "m30touchhid" in src and "m30_irq_sample()" in src
        lines = src.splitlines()
        calls = [i for i, line in enumerate(lines) if "sweet_hid_touch(" in line]
        assert len(calls) == 5
        assert all("m30_hid_enabled" in lines[i - 1] for i in calls[1:])
        print("PASS Melfas driver hash, IRQ sampler, and 4 gated HID calls")
        PY
    - name: Verify M30 UI heartbeat diagnostic patch applied
      if: inputs.ui_exact != 'true'
      run: |
        p=0453-m30-ui-heartbeat.patch
        grep -q "Applying patch: .*$p" build.log
        if grep -q "Skipping patch .*$p" build.log; then
          echo "ERROR: patch $p was skipped by the tolerant build script"
          exit 1
        fi
        python3 - <<'PY'
        import hashlib
        from pathlib import Path
        want = {
          # v85: deliberately changed by 0456-m30-uihb-ring-budget.patch, which
          # makes the sampler dormant by default and caps its ring output.
          # Prior value: d6a394dfd49c144e0e223d67d2d430b6b779c6758c95eaffd69ab361fa0493b0
          "bsd/dev/sweet_sample.c": "2f982bae8a65d2b52a2db7dcfa9615d59096b8df5477ee90a889e55b2a43f30e",
          "osfmk/vm/vm_fault.c": "de26a8e91b0fdb3504d4172f6a7324c532a9c82c8ff15f4da6699fc2c59ba133",
        }
        for rel, expect in want.items():
            got = hashlib.sha256((Path("dxb/xnu") / rel).read_bytes()).hexdigest()
            if got != expect:
                raise SystemExit(f"ERROR: {rel} sha256 {got} != {expect}")
            print(f"PASS {rel} {got}")
        PY
    - name: Verify M30 lock-screen diagnostic patch applied
      if: inputs.ui_exact != 'true'
      run: |
        p=0455-m30-lockscreen-diag.patch
        grep -q "Applying patch: .*$p" build.log
        if grep -q "Skipping patch .*$p" build.log; then
          echo "ERROR: patch $p was skipped by the tolerant build script"
          exit 1
        fi
        grep -q 'm30sblockdiag' dxb/xnu/bsd/dev/sweet_sample.c
        python3 tools/test_m30_lockscreen_diag.py

    - name: Verify M30 UI heartbeat framebuffer patch applied
      if: inputs.ui_exact != 'true'
      run: |
        p=0454-m30-ui-hb-framebuffer.patch
        grep -q "Applying patch: .*$p" build.log
        if grep -q "Skipping patch .*$p" build.log; then
          echo "ERROR: patch $p was skipped by the tolerant build script"
          exit 1
        fi
        python3 - <<'PY'
        import hashlib
        from pathlib import Path
        want = {
          # v85: deliberately changed by 0456-m30-uihb-ring-budget.patch, which
          # makes the sampler dormant by default and caps its ring output.
          # Prior value: d6a394dfd49c144e0e223d67d2d430b6b779c6758c95eaffd69ab361fa0493b0
          "bsd/dev/sweet_sample.c": "2f982bae8a65d2b52a2db7dcfa9615d59096b8df5477ee90a889e55b2a43f30e",
          "iokit/Kernel/arm/SweetFramebuffer.cpp": (
        "695fd229053168433a2aec5b55af4d40d09d8f3a6508d3e02b7ffa7f131436e3"
        if "${{ inputs.ui_exact }}" == "true" else
        "11b4d614e8f641d71da1cdbb010995c42e621f5ebbb0aef5ea06250223aa8e5f"),
        }
        for rel, expect in want.items():
            got = hashlib.sha256((Path("dxb/xnu") / rel).read_bytes()).hexdigest()
            if got != expect:
                raise SystemExit(f"ERROR: {rel} sha256 {got} != {expect}")
            print(f"PASS {rel} {got}")
        PY
    - name: Verify XNU target (iOS vs OSX)
      run: |
        echo "=== XNU_TARGET=$XNU_TARGET ==="
        echo "=== SDKROOT in build.sh kernel make ==="
        grep -n "make install -j8 VERBOSE=YES" dxb/build.sh
        echo "=== target defines observed in build log ==="
        if grep -q -- "-DXNU_TARGET_OS_IOS" build.log; then echo "FOUND -DXNU_TARGET_OS_IOS"; fi
        if grep -q -- "-DXNU_TARGET_OS_OSX" build.log; then echo "FOUND -DXNU_TARGET_OS_OSX"; fi
        python3 - <<'PY'
        import os, sys
        target = os.environ.get("XNU_TARGET", "iphoneos")
        log = open("build.log", errors="replace").read()
        ios = "-DXNU_TARGET_OS_IOS" in log or "-DXNU_PLATFORM_iPhoneOS" in log
        osx = "-DXNU_TARGET_OS_OSX" in log
        print(f"ios_define_present={ios} osx_define_present={osx} target={target}")
        if target == "iphoneos":
            if not ios and "SDKROOT=iphoneos" not in open("dxb/build.sh").read():
                print("ERROR: iOS target requested but no iOS evidence in build"); sys.exit(1)
            if osx and not ios:
                print("ERROR: iOS target requested but OSX define present"); sys.exit(1)
            print("PASS: iOS target selected (SDKROOT=iphoneos, XNU_TARGET_OS_IOS)")
        else:
            print("PASS: legacy macosx reference target")
        PY
    - name: Verify exact M30 kernel binary
      run: |
        set -o pipefail
        kc=$(echo "$KERNEL_CONFIG" | tr A-Z a-z)
        # macosx target: kernel.<kc>.m30lte in /System/Library/Kernels; ios target: mach.<kc>.m30lte at fakeroot root
        kernel="dxb/fakeroot/System/Library/Kernels/kernel.${kc}.m30lte"
        if [ ! -f "$kernel" ]; then
          kernel="dxb/fakeroot/mach.${kc}.m30lte"
        fi
        echo "kernel path: $kernel"
        test -f "$kernel" || { echo "ERROR: kernel binary not found"; exit 1; }
        python3 tools/verify_m30_kernel.py \
          --kernel "$kernel" \
          --objdump "xcrun llvm-objdump" \
          --nm "xcrun llvm-nm" | tee m30-kernel-verification.json
    - name: Report build errors as annotations
      if: always()
      run: |
        test -f build.log || exit 0
        kc=$(echo "$KERNEL_CONFIG" | tr A-Z a-z)
        # macosx target: kernel.<kc>.<mc> in /System/Library/Kernels; ios: mach.<kc>.<mc> at fakeroot root
        for kernel in \
          "dxb/fakeroot/System/Library/Kernels/kernel.${kc}.$(echo "$MACHINE_CONFIG" | tr A-Z a-z)" \
          "dxb/fakeroot/mach.${kc}.$(echo "$MACHINE_CONFIG" | tr A-Z a-z)"; do
          if [ -f "$kernel" ]; then echo "kernel built: $kernel"; exit 0; fi
        done
        python3 - build.log <<'PYEOF'
        import re, sys
        lines = open(sys.argv[1], errors='replace').read().splitlines()
        clean = [re.sub(r'\x1b\[[0-9;]*m', '', l) for l in lines]
        cc = re.compile(r'(:\d+:\d+: (fatal )?error:|^ld: (?!warning)|Undefined symbols|clang: error|^make.*Error)')
        hits = [l for l in clean if cc.search(l)]
        for i, l in enumerate(clean):
            if re.search(r':\d+:\d+: (fatal )?error:', l) and len(hits) < 40:
                hits.append('CONTEXT ' + ''.join(x[:200] for x in clean[i:i + 4]))
        pat = re.compile(r'(error:|fatal error|Error \d|\*\*\* |FAILED|No such file|panic)', re.I)
        hits += [l for l in clean if pat.search(l) and l not in hits]
        esc = lambda s: s.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
        for l in hits[:9]:
            print('::error title=build::' + esc(l[:900]))
        tail = '\n'.join(l[:300] for l in clean[-60:])
        print('::error title=build log tail::' + esc(tail[-30000:]))
        PYEOF
        exit 1
    - name: Package build tree for local compiles
      if: always()
      run: |
        SDK=$(xcrun --sdk macosx --show-sdk-path)
        mkdir -p sdk-kernel-platform
        cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
        tar czf buildtree.tgz \
          --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
          --exclude='kernel.development.*' --exclude='.git' \
          -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
          -C .. sdk-kernel-platform
        ls -la buildtree.tgz
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: xnu-buildtree-${{ matrix.runner }}
        path: buildtree.tgz
        retention-days: 1
    - name: Collect
      if: always()
      run: |
        mkdir -p out
        # macosx target: /System/Library/Kernels/kernel.*; ios target: mach.* at fakeroot root
        cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
        cp dxb/fakeroot/mach.* out/ 2>/dev/null || true
        ls -la out
        (cd out && shasum -a 256 kernel.* mach.* > SHA256SUMS 2>/dev/null) || true
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: xnu-kernel-${{ matrix.runner }}
        # The patch manifest and its verification report travel WITH the kernel:
        # a kernel whose applied-patch set is unknown must not be usable as a
        # candidate. This is the artifact the provenance audit reads.
        path: |
          out/
          m30-patch-manifest.tsv
          m30-patch-provenance.json
          build.log
        if-no-files-found: warn
        retention-days: 1
    - name: Check Cortex-A53 compatibility (no ARMv8.1 LSE atomics)
      if: env.MACHINE_CONFIG == 'A5XELTE' || env.MACHINE_CONFIG == 'HEROLTE' || env.MACHINE_CONFIG == 'M20LTE' || env.MACHINE_CONFIG == 'M30LTE'
      run: |
        kc=$(echo "$KERNEL_CONFIG" | tr A-Z a-z)
        mc=$(echo "$MACHINE_CONFIG" | tr A-Z a-z)
        kernel="out/kernel.${kc}.${mc}"
        [ -f "$kernel" ] || kernel="out/mach.${kc}.${mc}"
        test -f "$kernel"
        xcrun llvm-objdump -d --no-show-raw-insn "$kernel" > lse-scan.txt || {
          echo "::error title=LSE check::llvm-objdump failed on $kernel"; exit 1; }
        python3 - lse-scan.txt "$kernel" <<'PYEOF'
        import re, sys
        lse = re.compile(r'\s(cas|casp|ldadd|ldclr|ldeor|ldset|ldsmax|ldsmin|ldumax|ldumin|stadd|stclr|steor|stset|stsmax|stsmin|stumax|stumin|swp)[a-z]*\s')
        data_symbols = {'K256'}
        func, funcs, samples = '?', {}, []
        for line in open(sys.argv[1], errors='replace'):
            m = re.match(r'^[0-9a-f]+ <(.+)>:', line)
            if m:
                func = m.group(1)
            elif lse.search(line) and func not in data_symbols:
                funcs[func] = funcs.get(func, 0) + 1
                if len(samples) < 8:
                    samples.append(func + ': ' + line.strip())
        count = sum(funcs.values())
        print(f'LSE instructions in code of {sys.argv[2]}: {count}')
        if count:
            top = sorted(funcs.items(), key=lambda kv: -kv[1])[:40]
            msg = f'{count} LSE instructions in {len(funcs)} functions\n'
            msg += '\n'.join(f'{n} {f}' for f, n in top) + '\n--\n' + '\n'.join(samples)
            print('::error title=LSE in kernel::' + msg.replace('%', '%25').replace('\n', '%0A'))
            sys.exit(1)
        PYEOF